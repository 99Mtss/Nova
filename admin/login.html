
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login ADM | NØVA</title>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --admin-bg: #f7f4ee;
            --admin-card: #ffffff;
            --admin-card-hover: #f4f0e9;
            --admin-border: #ded8cd;
            --admin-text: #191916;
            --admin-muted: #6d6a63;
            --admin-accent: #9a6a45;
            --admin-accent-dark: #745033;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--admin-bg);
            color: var(--admin-text);
            font-family: 'Montserrat', sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            background: var(--admin-card);
            border: 1px solid var(--admin-border);
            border-radius: 18px;
            box-shadow: 0 20px 70px #0006;
        }

        .logo {
            margin-bottom: 32px;
            text-align: center;
        }

        .logo h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 5px;
        }

        .logo span {
            display: block;
            margin-top: 8px;
            color: var(--admin-accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 23px;
        }

        .description {
            margin-bottom: 28px;
            color: var(--admin-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            background: var(--admin-bg);
            border: 1px solid var(--admin-border);
            border-radius: 9px;
        }

        .input-wrapper i {
            color: var(--admin-accent);
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 14px 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--admin-text);
            font: inherit;
            font-size: 13px;
        }

        .input-wrapper:focus-within {
            border-color: var(--admin-accent);
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 15px;
            border: 0;
            border-radius: 9px;
            background: var(--admin-accent);
            color: #ffffff;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--admin-accent-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }

        #mensagem {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #mensagem.erro {
            display: block;
            background: #fae9e9;
            color: #8d2933;
        }

        #mensagem.sucesso {
            display: block;
            background: #e7f2eb;
            color: #286044;
        }

        .footer {
            margin-top: 26px;
            color: var(--admin-muted);
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">

        <div class="logo">
            <h1>NØVA</h1>
            <span>ADMINISTRAÇÃO</span>
        </div>

        <h2>Bem-vindo de volta</h2>

        <p class="description">
            Entre com sua conta autorizada para acessar o painel administrativo.
        </p>

        <form id="loginForm">
            <div class="field">
                <label for="email">E-mail</label>

                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope" aria-hidden="true"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        placeholder="seu@email.com"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label for="senha">Senha</label>

                <div class="input-wrapper">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>
            </div>

            <button type="submit" id="btnLogin">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                Entrar no painel
            </button>

            <div
                id="mensagem"
                role="status"
                aria-live="polite"
            ></div>
        </form>

        <p class="footer">NØVA Store · Área restrita</p>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CONFIGURAÇÃO E CONEXÃO COM O SUPABASE -->
    <script src="js/supabase.js"></script>
    <!-- AUTENTICAÇÃO DO ADMINISTRADOR -->
    <script src="js/login.js"></script>


</body>
</html>
